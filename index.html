<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FW Demling – Termine</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #f2f2f7 0%, #ffffff 100%);
      color: #1c1c1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }
    .topbar {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px 0;
      font-size: 13px;
      font-weight: 600;
      color: #d92d20;
      letter-spacing: 0.6px;
    }
    .card {
      background: white;
      border-radius: 22px;
      padding: 26px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 { font-size: 22px; margin: 6px 0 4px 0; }
    h2 { font-size: 15px; font-weight: 500; color: #3a3a3c; margin: 0 0 14px 0; }
    .meta { font-size: 12px; color: #8e8e93; margin-bottom: 18px; }
    p { font-size: 14px; color: #6e6e73; margin: 0 0 22px 0; line-height: 1.45; }
    .divider { height: 1px; background: #e5e5ea; margin: 18px 0; }
    .btn {
      display: block;
      padding: 16px;
      margin-top: 12px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: transform 0.06s ease;
    }
    .btn:active { transform: scale(0.98); }
    .primary { background: #d92d20; color: white; }
    .footer { margin-top: 16px; font-size: 11px; color: #8e8e93; }
  </style>
</head>
<body>
  <div class="topbar">🚒 FW DEMLING</div>
  <div class="card">
    <h1>📅 Termine - für deine Geräte</h1>
    <p>
      Lade die Termine herunter und füge sie deinem Kalender hinzu.
      	  Nach dem Download im angezeigten Fenster öffnen oder speichern.
    </p>
    <div class="divider"></div>
    <a class="btn primary" href="fw_demling_termine.ics">
      📥 Termine herunterladen
    </a>
    <div class="footer">
      Offizielle Termine der freiwilligen Feuerwehr Demling
    </div>
  </div>
</body>
</html>
